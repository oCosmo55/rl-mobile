name: Build Spicy patches

# Manual run: Actions tab -> "Build Spicy patches" -> Run workflow
# Output: patches.zip (artifact "spicy-patches"), imported in the Manager as Custom Patches
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      # baksmali 2.5.2 and its libraries from Maven Central
      - name: Get baksmali
        run: |
          mkdir -p "$RUNNER_TEMP/bk" && cd "$RUNNER_TEMP/bk"
          cat > pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>x</groupId><artifactId>x</artifactId><version>1</version>
            <dependencies>
              <dependency><groupId>org.smali</groupId><artifactId>baksmali</artifactId><version>2.5.2</version></dependency>
            </dependencies>
          </project>
          POM
          mvn -q -B dependency:copy-dependencies -DoutputDirectory=libs
          ls libs

      - name: Build extension smali from the Java sources
        env:
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
          BAKSMALI_CP: ${{ runner.temp }}/bk/libs/*
        run: bash tools/rl-ext-build/build.sh

      - name: Zip the patches
        run: |
          cd patches
          zip -qr ../patches.zip . -x "data.json"
          ls -la ../patches.zip

      - uses: actions/upload-artifact@v4
        with:
          name: spicy-patches
          path: patches.zip
